[package]
name = "reqwest_native"
version = "1.0.0"
edition = "2024"

[lib]
name = "reqwest_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.25.0", features = ["extension-module", "experimental-async"] }
pyo3-bytes = "=0.3.0"
pythonize = "=0.25.0"
reqwest = { version = "=0.12.15", features = ["default", "rustls-tls", "blocking", "cookies", "gzip", "zstd", "brotli", "deflate", "multipart", "stream", "socks"] }
http = "=1.3.1"
http-serde = "=2.1.1"
tokio = { version = "=1.45.1", features = ["rt", "time", "sync", "macros"] }
futures-util = "=0.3.31"
async-stream = "=0.3.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[build-dependencies]
pyo3-build-config = "=0.25.0"
